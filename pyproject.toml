[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-automation"
version = "0.1.0"
description = "Focused automation tools for molecular-dynamics workflows"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
md-automation = "md_automation.charmm_gui_gromacs:main"

[tool.setuptools.packages.find]
where = ["src"]
